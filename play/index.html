<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The browser build's page (31 October 2026): on an iPhone it installs to the Home Screen and plays full screen in
     landscape like an app. The game keeps its controls clear of the notch with window.hhsSafeInsets (ui/stage_fit.gd). -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Heaven Has Stones">
<meta name="theme-color" content="#2c182e">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Pond prototype</title>
<style>
html, body {
	margin: 0;
	padding: 0;
	height: 100%;
	background: #0a0814;
	color: #ffe4b8;
	overflow: hidden;
	overscroll-behavior: none;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
}
body { position: fixed; inset: 0; }
#canvas { display: block; position: fixed; left: 0; top: 0; border: 0; }
#canvas:focus { outline: none; }

/* Loading, in the game's colours. */
#status {
	position: fixed; inset: 0; z-index: 2;
	display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
	background: radial-gradient(ellipse at 50% 35%, #3c2634 0%, #2c182e 55%, #0a0814 100%);
	padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#status-splash { max-width: min(46vw, 420px); max-height: 46vh; image-rendering: pixelated; }
#status-bar { width: min(52vw, 360px); height: 8px; background: #54364b; border-radius: 4px; overflow: hidden; }
#status-fill { width: 0%; height: 100%; background: #f0b46f; transition: width 0.2s; }
#status-text { font-size: 13px; color: #d4b59b; letter-spacing: 0.04em; }
#status-notice { display: none; max-width: 80vw; padding: 14px 18px; background: #5b3943; border: 1px solid #9b3943; border-radius: 8px; text-align: center; line-height: 1.4; }

/* Safari, not yet on the Home Screen: how to install it. */
#install {
	display: none; position: fixed; z-index: 3; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom));
	transform: translateX(-50%); max-width: 86vw;
	background: #3c2634; border: 2px solid #f0b46f; border-radius: 10px; padding: 10px 14px;
	font-size: 14px; line-height: 1.4; text-align: center; color: #ffe4b8;
}
#install b { color: #ffe08a; }
#install button { margin-left: 10px; background: none; border: 1px solid #d4b59b; color: #d4b59b; border-radius: 6px; padding: 2px 10px; font-size: 13px; }

/* A phone held upright: ask for landscape (a web app cannot lock its rotation on iOS). */
#turn {
	display: none; position: fixed; inset: 0; z-index: 4;
	flex-direction: column; align-items: center; justify-content: center; gap: 16px;
	background: #2c182e; color: #ffe4b8; text-align: center; font-size: 17px;
}
#turn .phone { width: 46px; height: 80px; border: 4px solid #ffe08a; border-radius: 10px; animation: turn 2.4s ease-in-out infinite; }
@keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (pointer: coarse) { #turn { display: flex; } }
@media (prefers-reduced-motion: reduce) { #turn .phone { animation: none; transform: rotate(-90deg); } }

/* Read by window.hhsSafeInsets: the notch and the home bar, in CSS pixels. */
#safe-probe {
	position: fixed; visibility: hidden; pointer-events: none; left: 0; top: 0; width: 0; height: 0;
	padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
/* Netlify's free plan adds a "Powered by Netlify" badge to every page. It sat over the Discards button on a phone; Tate
   asked for it gone (7 November 2026). */
#nl-badge-frame { display: none !important; }
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<noscript>Heaven Has Stones needs JavaScript.</noscript>
<div id="safe-probe"></div>

<div id="status">
	<img id="status-splash" src="cover.png" alt="Heaven Has Stones">
	<div id="status-bar"><div id="status-fill"></div></div>
	<div id="status-text">Loading the pond...</div>
	<div id="status-notice"></div>
</div>

<div id="install">To play it like an app: tap <b>Share</b>, then <b>Add to Home Screen</b>.<button id="install-close" type="button">OK</button></div>

<div id="turn"><div class="phone"></div><div>Turn your phone sideways to play.</div></div>

<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":88744952,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

// The notch and the home bar as "left,top,right,bottom,width,height" in CSS pixels, for the game's safe area.
window.hhsSafeInsets = function () {
	const s = getComputedStyle(document.getElementById('safe-probe'));
	const n = (v) => Math.round(parseFloat(v) || 0);
	return [n(s.paddingLeft), n(s.paddingTop), n(s.paddingRight), n(s.paddingBottom), window.innerWidth, window.innerHeight].join(',');
};

(function () {
	const status = document.getElementById('status');
	const fill = document.getElementById('status-fill');
	const text = document.getElementById('status-text');
	const notice = document.getElementById('status-notice');
	const ua = navigator.userAgent;
	const ios = /iPhone|iPad|iPod/.test(ua) || (ua.includes('Macintosh') && navigator.maxTouchPoints > 1);
	const installed = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches
		|| window.matchMedia('(display-mode: fullscreen)').matches;

	// Sound plays with the silent switch on, like a game app (Safari 16.4 and later).
	try { if (navigator.audioSession) { navigator.audioSession.type = 'playback'; } } catch (e) { /* older Safari */ }
	// Keep the save: ask the browser not to clear this site's storage on its own.
	try { if (navigator.storage && navigator.storage.persist) { navigator.storage.persist(); } } catch (e) { /* not offered */ }

	// In Safari on an iPhone, before it is on the Home Screen: show how to install it, once a visit.
	if (ios && !installed) {
		let seen = false;
		try { seen = sessionStorage.getItem('hhs-install-hint') === '1'; } catch (e) { /* private mode */ }
		if (!seen) {
			const hint = document.getElementById('install');
			hint.style.display = 'block';
			document.getElementById('install-close').addEventListener('click', () => {
				hint.style.display = 'none';
				try { sessionStorage.setItem('hhs-install-hint', '1'); } catch (e) { /* private mode */ }
			});
		}
	}

	// No page scroll, pinch or double-tap zoom on top of the game.
	document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
	document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

	function fail(err) {
		console.error(err);
		notice.textContent = (err && err.message) ? err.message : String(err || 'Something went wrong loading the game.');
		notice.style.display = 'block';
		text.textContent = 'Could not start. Reload to try again.';
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('This browser is missing: ' + missing.join(', '));
		return;
	}
	engine.startGame({
		onProgress: function (current, total) {
			if (current > 0 && total > 0) {
				const pct = Math.min(100, Math.round(current * 100 / total));
				fill.style.width = pct + '%';
				text.textContent = 'Loading the pond... ' + pct + '%';
			}
		},
	}).then(() => {
		status.remove();
	}, fail);
}());
</script>
</body>
</html>
